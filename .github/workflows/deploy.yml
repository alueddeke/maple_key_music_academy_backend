name: Deploy Backend Prod
on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check no config fallbacks
        run: bash scripts/check-no-fallbacks.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          GOOGLE_CLIENT_ID: ci-client-id
          GOOGLE_CLIENT_SECRET: ci-client-secret
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          PLATFORM_ADMIN_EMAILS: e2e.manager@maplekeytest.com
          FRONTEND_URL: http://localhost:5173
          RESEND_API_KEY: ci-resend-key
          DEFAULT_FROM_EMAIL: ci@test.com
          HELCIM_API_TOKEN: ci-helcim-token
          HELCIM_TERMINAL_ID: ci-terminal
          HELCIM_WEBHOOK_SECRET: dGVzdC1zZWNyZXQ=
          HELCIM_SUBDOMAIN: citest
        run: pytest tests/

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/maple-key-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/maple-key-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The deploy body lives in the docker repo as numbered scripts
      # (MAP-191: maple_key_music_academy_docker/deployment/). This job only
      # streams the environment, copies the scripts and runs them —
      # the same run.sh the laptop path uses. Secrets never appear in the
      # SSH script text (GitHub caps that expression at 21,000 chars and bash
      # once mangled a `$` inside a token — MAP-212/218).
      - name: Checkout deployment scripts (docker repo, develop)
        uses: actions/checkout@v4
        with:
          repository: alueddeke/maple_key_music_academy_docker
          ref: develop
          path: docker-repo

      # One native ssh/scp step, identical to what deploy-from-laptop.sh does:
      # copy the scripts, stream deploy.env over ssh stdin (never a file on the
      # runner — the first run of the scp-action variant failed because the
      # action's container could not read the 0600 file the runner wrote),
      # then run the stages.
      - name: Deploy (copy scripts, stream deploy.env, run.sh)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          HELCIM_API_TOKEN: ${{ secrets.HELCIM_API_TOKEN }}
          HELCIM_TERMINAL_ID: ${{ secrets.HELCIM_TERMINAL_ID }}
          HELCIM_WEBHOOK_SECRET: ${{ secrets.HELCIM_WEBHOOK_SECRET }}
          HELCIM_SUBDOMAIN: ${{ secrets.HELCIM_SUBDOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          VPC_HOST: ${{ secrets.VPC_HOST }}
          VPC_USERNAME: ${{ secrets.VPC_USERNAME }}
          VPC_PORT: ${{ secrets.VPC_PORT || 22 }}
          VPC_SSH_KEY: ${{ secrets.VPC_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VPC_SSH_KEY" > "$KEY"
          OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          DEST="$VPC_USERNAME@$VPC_HOST"
          ssh "${OPTS[@]}" -p "$VPC_PORT" "$DEST" 'mkdir -p ~/deployment'
          scp "${OPTS[@]}" -P "$VPC_PORT" -q docker-repo/deployment/*.sh "$DEST":deployment/
          bash docker-repo/deployment/write-deploy-env.sh - \
            | ssh "${OPTS[@]}" -p "$VPC_PORT" "$DEST" 'umask 077; cat > ~/deployment/deploy.env'
          ssh "${OPTS[@]}" -p "$VPC_PORT" "$DEST" 'bash ~/deployment/run.sh'

      - name: Tag successful deploy
        run: |
          # Minute precision: two deploys in the same hour collided on the
          # old hour-only tag and failed this step after a successful deploy
          # (2026-09-01). Tagging is best-effort — never fail the run for it.
          TAG="deploy-$(date -u +%Y-%m-%d-%H%M)"
          git tag "$TAG" && git push origin "$TAG" || echo "tagging skipped: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
