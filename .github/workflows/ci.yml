name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check no config fallbacks
        run: bash scripts/check-no-fallbacks.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          PLATFORM_ADMIN_EMAILS: e2e.manager@maplekeytest.com
          FRONTEND_URL: http://localhost:5173
          RESEND_API_KEY: ci-resend-key
          DEFAULT_FROM_EMAIL: ci@test.com
          HELCIM_API_TOKEN: ci-helcim-token
          HELCIM_TERMINAL_ID: ci-terminal
          HELCIM_WEBHOOK_SECRET: dGVzdC1zZWNyZXQ=
          HELCIM_SUBDOMAIN: citest
        run: |
          python manage.py makemigrations --check --dry-run || {
            echo "::error::Model changes without a migration. Fix: merge develop into your branch, then run 'docker compose exec api python manage.py makemigrations <app>' and commit the migration (backend CLAUDE.md → Migration Workflow)."
            exit 1
          }

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          PLATFORM_ADMIN_EMAILS: e2e.manager@maplekeytest.com
          FRONTEND_URL: http://localhost:5173
          RESEND_API_KEY: ci-resend-key
          DEFAULT_FROM_EMAIL: ci@test.com
          HELCIM_API_TOKEN: ci-helcim-token
          HELCIM_TERMINAL_ID: ci-terminal
          HELCIM_WEBHOOK_SECRET: dGVzdC1zZWNyZXQ=
          HELCIM_SUBDOMAIN: citest
        run: pytest tests/

  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  # MAP-165: pytest runs --no-migrations, so nothing else in CI applies the
  # migration chain. This job migrates an empty database 0001 → head, the way
  # every fresh install / new environment does.
  migrate-from-empty:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PLATFORM_ADMIN_EMAILS: e2e.manager@maplekeytest.com
      FRONTEND_URL: http://localhost:5173
      RESEND_API_KEY: ci-resend-key
      DEFAULT_FROM_EMAIL: ci@test.com
      HELCIM_API_TOKEN: ci-helcim-token
      HELCIM_TERMINAL_ID: ci-terminal
      HELCIM_WEBHOOK_SECRET: dGVzdC1zZWNyZXQ=
      HELCIM_SUBDOMAIN: citest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate empty database (full chain)
        run: |
          python manage.py migrate --no-input || {
            echo "::error::The migration chain does not apply to an empty database (traceback above). Every fresh install and new environment would crash here. Reproduce: fresh Postgres + 'python manage.py migrate'."
            exit 1
          }

      - name: Assert no unapplied migrations
        run: |
          python manage.py migrate --check || {
            echo "::error::Unapplied migrations remain after a full migrate."
            exit 1
          }

  # MAP-247: duplication/complexity report at warn (measure rung, STANDARDS
  # enforcement ladder). --exit-zero: prints the report, never fails the PR.
  # pylint is installed here, not in requirements.txt (that file builds the
  # production image). Seeds + tests are excluded (owner ruling 2026-09-29).
  complexity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pylint
        run: pip install pylint==4.0.10

      - name: Duplication/complexity report (warn)
        run: >-
          pylint --disable=all
          --enable=duplicate-code,too-many-branches,too-many-statements
          --ignore=migrations,tests,seed_realistic.py,seed_billing_test.py
          --exit-zero
          analytics billing custom_auth maple_key_backend notifications teacher_profiles
